<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#06080b;--pn:#0c1015;--ln:#1a232d;--tx:#e8f1f8;--mu:#66788a;--ac:#22d3ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body[data-th=a]{--ac:#fbbf24}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:14px 'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column}
.logo,h2,h3,.big{font-family:Orbitron,'Share Tech Mono',monospace}
small{color:var(--mu);letter-spacing:.18em;font-size:11px;display:block}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 4px;position:relative}
.logo{font-size:20px;letter-spacing:.35em;font-weight:700;color:var(--ac)}
.r{display:flex;gap:14px;align-items:center;color:var(--mu)}
.st{color:var(--ac);display:flex;gap:7px;align-items:center;letter-spacing:.12em;font-size:12px}
.st i{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
button{font:inherit;background:none;color:var(--tx);border:1px solid var(--ln);padding:9px 16px;letter-spacing:.14em;font-size:12px;cursor:pointer;transition:.2s}
button:hover,button:focus-visible{border-color:var(--ac);color:var(--ac);box-shadow:0 0 14px -3px var(--ac);outline:none}
.pri{border-color:var(--ac);color:var(--ac)}
.g{border:0;padding:6px 0;color:var(--mu)}
main{flex:1;display:grid;grid-template-columns:1fr 1.3fr .85fr;gap:14px;padding:14px 20px;align-content:start}
.pn{background:var(--pn);border:1px solid var(--ln);padding:20px;min-width:0}
h2{margin:0 0 16px;font-size:12px;letter-spacing:.25em;color:var(--mu);font-weight:500}
h3{margin:6px 0 14px;font-size:18px;letter-spacing:.08em;font-weight:500;overflow-wrap:anywhere}
.obj{border:1px solid var(--ac);padding:14px;margin-bottom:16px;animation:pl 3.2s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 18px -6px var(--ac)}}
ul{list-style:none;margin:0 0 12px;padding:0}
li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
li .tx{flex:1;overflow-wrap:anywhere;outline:none;cursor:text}
li.d .tx{text-decoration:line-through;opacity:.4}
li button{border:0;padding:2px 6px;color:var(--mu)}
li .ck{width:18px;height:18px;padding:0;border:1px solid var(--mu);position:relative;flex:none;color:var(--ac)}
li .ck::after{content:'';position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid var(--ac);border-width:0 2px 2px 0;transform:rotate(40deg) scale(0);transition:.2s}
li.d .ck{border-color:var(--ac)}
li.d .ck::after{transform:rotate(40deg) scale(1)}
.ad{display:flex;gap:8px}
input{font:inherit;background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--ln);padding:8px 2px;outline:none;min-width:0}
input:focus{border-color:var(--ac)}
.ad input{flex:1}
.ct{text-align:center;display:flex;flex-direction:column;align-items:center}
.rw{position:relative;width:min(80vw,310px);aspect-ratio:1;margin:6px 0 18px}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:3}
.bgc{stroke:var(--ln)}
#rg{stroke:var(--ac);stroke-dasharray:754;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--ac));transition:stroke-dashoffset .3s linear}
.ti{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tm{font-size:clamp(46px,13vw,64px);letter-spacing:.04em}
.lg .tm{font-size:clamp(34px,10vw,48px)}
.su{display:flex;gap:16px;justify-content:center;margin-bottom:14px}
.su label{color:var(--mu);font-size:10px;letter-spacing:.18em}
.su input{display:block;width:62px;text-align:center;font-size:20px;color:var(--tx);margin-bottom:4px}
.ps,.bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.ps button{padding:6px 10px;font-size:11px}
.big{font-size:30px;margin:6px 0 2px}
.bar{height:6px;background:var(--ln);margin:18px 0 8px}
.bar i{display:block;height:100%;background:var(--ac);box-shadow:0 0 10px var(--ac);transition:width .6s ease}
.rm{font-size:26px;margin:4px 0 18px}
.ft{grid-column:1/-1;order:9;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px}
.ft input{font-size:16px;color:var(--tx);width:min(60vw,280px)}
.ft div{display:flex;gap:8px}
.em{grid-column:1/-1;text-align:center;padding:64px 20px}
.em p{font-family:Orbitron,monospace;font-size:20px;line-height:1.9;margin:18px 0 28px}
.pop{position:absolute;right:20px;top:54px;z-index:5;background:var(--pn);border:1px solid var(--ln);padding:12px;display:flex;flex-direction:column;gap:8px;width:240px}
.pop[hidden]{display:none}
.pop div{color:var(--mu);font-size:11px;line-height:1.7;padding:4px 0}
#ov,#fo{position:fixed;inset:0;background:rgba(4,6,8,.96);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:20px}
#ov:empty,#fo:empty{display:none}
#ov>div{animation:in .8s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;gap:6px}
@keyframes in{from{opacity:0;transform:scale(.94);filter:blur(6px)}}
.cm h2{font-size:22px;color:var(--ac);letter-spacing:.3em;margin:6px 0 24px;text-shadow:0 0 20px var(--ac)}
.cm .row{display:flex;gap:34px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
#fo .big{font-size:clamp(54px,16vw,120px);margin:20px 0 10px;color:var(--ac)}
@media(max-width:1000px){main{grid-template-columns:1fr 1fr}.ct{grid-column:1/-1;order:-1}}
@media(max-width:640px){main{grid-template-columns:1fr;padding:12px}.r #clk{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div><div class="logo">JARVIS</div><small>FOCUS COMMAND CENTER</small></div>
  <div class="r"><span id="clk"></span><span class="st"><i></i>SYSTEM: ONLINE</span><button class="g" data-a="gear" aria-label="Settings">⚙</button></div>
  <div class="pop" id="set" hidden>
    <button data-a="snd"></button><button data-a="clk"></button><button data-a="th"></button>
    <div>SPACE start / pause<br>R reset timer<br>ENTER complete task<br>F focus mode · ESC exit</div>
    <button data-a="clr">CLEAR SESSION</button>
  </div>
</header>
<main id="app"></main>
<div id="ov"></div><div id="fo"></div>

<script>
const D={name:'Saturday Lock-In',tasks:[],total:7200,left:7200,run:0,end:0,on:0,fin:0,used:0,snd:1,h24:1,th:'c'};
let S,add=0,foc=0,ac,dg;
try{S={...D,...JSON.parse(localStorage.jarvis)}}catch{S={...D}}
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0');
const save=()=>{try{localStorage.jarvis=JSON.stringify(S)}catch{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(t,l=S.total)=>(l>=3600?p(t/3600|0)+':':'')+p(t%3600/60|0)+':'+p(t%60);
const cur=()=>S.run?Math.max(0,Math.ceil((S.end-Date.now())/1000)):S.left;

function beep(f,d=.05,v=.04,t=0){if(!S.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch{}}
const chime=()=>[660,880,1320].forEach((f,i)=>beep(f,.45,.06,i*.18));

function finish(){S.left=cur();S.run=0;S.fin=1;S.used=S.total-S.left;chime();save();render()}
function start(){if(S.fin||!S.left)return;S.run=1;S.end=Date.now()+S.left*1000}
function pause(){S.left=cur();S.run=0}
function reset(){S.run=0;S.left=S.total;S.fin=0}
function tog(i){const t=S.tasks[i];if(!t)return;t.d=!t.d;beep(520,.06);if(S.tasks.every(x=>x.d))finish()}
const nxt=()=>{const i=S.tasks.findIndex(t=>!t.d);if(i>-1)tog(i)};

const A={
  on(){S.on=1},
  start,pause,reset,
  new(){S.tasks=S.tasks.filter(t=>!t.d);S.fin=0;S.run=0;S.left=S.total},
  ps(b){S.total=S.left=+b.dataset.m*60},
  tg(b){tog(+b.dataset.i)},
  cur(){nxt()},
  up(b){const i=+b.dataset.i;if(i>0)[S.tasks[i-1],S.tasks[i]]=[S.tasks[i],S.tasks[i-1]]},
  rm(b){S.tasks.splice(+b.dataset.i,1)},
  addo(){add=1},
  ad(){const v=($('#ni').value||'').trim();if(v)S.tasks.push({t:v,d:0})},
  rs(){S.tasks.forEach(t=>t.d=0);reset()},
  foc(){foc=1;try{document.documentElement.requestFullscreen().catch(()=>{})}catch{}},
  snd(){S.snd=+!S.snd},clk(){S.h24=+!S.h24},th(){S.th=S.th=='c'?'a':'c'},
  clr(){S={...D,snd:S.snd,h24:S.h24,th:S.th};add=0;$('#set').hidden=true},
};
function exitFoc(){foc=0;if(document.fullscreenElement)document.exitFullscreen()}

function render(){
  document.body.dataset.th=S.th;
  const T=S.tasks,n=T.length,dn=T.filter(t=>t.d).length,pc=n?Math.round(dn/n*100):0,c=T.find(t=>!t.d);
  const setup=!S.run&&!S.fin&&S.left==S.total,paused=!S.run&&!S.fin&&S.left<S.total;
  const hms=[S.total/3600|0,S.total%3600/60|0,S.total%60];
  $('[data-a=snd]').textContent='SOUND: '+(S.snd?'ON':'OFF');
  $('[data-a=clk]').textContent='CLOCK: '+(S.h24?'24-HOUR':'12-HOUR');
  $('[data-a=th]').textContent='THEME: '+(S.th=='c'?'CYAN':'AMBER');
  if(!S.on){$('#app').innerHTML='<section class="pn em"><small>NO ACTIVE SESSION</small><p>Set your timer.<br>Add your missions.<br>Execute.</p><button class="pri" data-a="on">CREATE SESSION</button></section>';$('#ov').innerHTML=$('#fo').innerHTML='';return}
  $('#app').innerHTML=`
  <section class="pn">
    <h2>MISSION TASKS</h2>
    <div class="obj"><small>CURRENT OBJECTIVE</small><h3>${c?esc(c.t):'NO OPEN MISSIONS'}</h3>${c?'<button data-a="cur">MARK COMPLETE</button>':''}</div>
    <ul>${T.map((t,i)=>`<li draggable="true" data-i="${i}" class="${t.d?'d':''}"><button class="ck" data-a="tg" data-i="${i}" aria-label="Toggle task"></button><span class="tx" data-i="${i}" title="Double-click to edit">${esc(t.t)}</span><button data-a="up" data-i="${i}" aria-label="Move up">↑</button><button data-a="rm" data-i="${i}" aria-label="Delete">×</button></li>`).join('')}</ul>
    ${add?'<div class="ad"><input id="ni" maxlength="80" placeholder="Study Chapter 4"><button class="pri" data-a="ad">ADD</button></div>':'<button class="g" data-a="addo">+ ADD TASK</button>'}
  </section>
  <section class="pn ct ${S.total>=3600?'lg':''}">
    <h2>SESSION TIMER</h2>
    <div class="rw"><svg viewBox="0 0 260 260"><circle class="bgc" cx="130" cy="130" r="120"/><circle id="rg" cx="130" cy="130" r="120"/></svg>
      <div class="ti"><div class="tm" id="tm"></div><small>${S.fin?'SESSION COMPLETE':paused?'PAUSED':setup?'READY':'&nbsp;'}</small></div></div>
    ${setup?`<div class="su">${['HOURS','MINUTES','SECONDS'].map((l,i)=>`<label><input type="number" min="0" max="${i?59:99}" value="${hms[i]}" data-u="${i}">${l}</label>`).join('')}</div>
    <div class="ps">${[25,45,60,90,120].map(m=>`<button data-a="ps" data-m="${m}">${m==120?'2 HR':m+' MIN'}</button>`).join('')}</div>`:''}
    <div class="bt">${S.fin?'<button class="pri" data-a="new">START NEW SESSION</button>':S.run?'<button class="pri" data-a="pause">PAUSE</button><button data-a="reset">RESET</button>':setup?'<button class="pri" data-a="start">START SESSION</button>':'<button class="pri" data-a="start">RESUME</button><button data-a="reset">RESET</button>'}</div>
  </section>
  <section class="pn">
    <h2>SESSION PROGRESS</h2>
    <small>TASKS</small><div class="big">${dn} / ${n}</div>
    <div class="bar"><i style="width:${pc}%"></i></div><div>${pc}%</div><br>
    <small>TIME REMAINING</small><div class="rm" id="rem"></div>
    <small>TASKS REMAINING</small><div class="big">${n-dn}</div>
  </section>
  <div class="ft pn"><label><small>SESSION</small><input id="nm" value="${esc(S.name)}" maxlength="40" aria-label="Session name"></label>
    <div><button data-a="foc">FOCUS MODE</button><button data-a="rs">RESET SESSION</button></div></div>`;
  const all=n>0&&dn==n;
  $('#ov').innerHTML=S.fin?`<div class="cm"><small>${all?'MISSION COMPLETE':'SESSION COMPLETE'}</small><h2>${esc(S.name)}</h2>
    <div class="row"><div><small>TASKS</small>${dn} / ${n} COMPLETE</div><div><small>TIME</small>${fmt(S.used,3600)}</div><div><small>STATUS</small>${all?'MISSION ACCOMPLISHED':'TIME ELAPSED'}</div></div>
    <button class="pri" data-a="new">NEW SESSION</button></div>`:'';
  $('#fo').innerHTML=foc&&!S.fin?`<div class="logo">JARVIS</div><div class="big" id="ftm"></div><h3>${c?esc(c.t):'ALL CLEAR'}</h3>${c?'<button class="pri" data-a="cur">COMPLETE</button>':''}<small style="margin-top:18px">ESC TO EXIT</small>`:'';
  if(add)$('#ni')?.focus();
  upd();
}

function upd(){
  const l=cur(),t=fmt(l);
  ['#tm','#ftm','#rem'].forEach(s=>{const e=$(s);if(e)e.textContent=t});
  const g=$('#rg');if(g)g.style.strokeDashoffset=754*(1-(S.total?l/S.total:0));
  document.title=S.run?t+' · JARVIS':'JARVIS';
  $('#clk').textContent=new Date().toLocaleTimeString([],{hourCycle:S.h24?'h23':'h12',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
const go=()=>{save();render()};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!e.target.closest('#set')&&!(b&&b.dataset.a=='gear'))$('#set').hidden=true;
  if(!b)return;
  beep(900,.03,.02);
  if(b.dataset.a=='gear'){$('#set').hidden=!$('#set').hidden;return}
  A[b.dataset.a]?.(b);go();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.u!=null){const v=[...document.querySelectorAll('[data-u]')].map(x=>Math.max(0,+x.value||0));S.total=S.left=Math.max(1,v[0]*3600+v[1]*60+v[2]);go()}
  else if(t.id=='nm'){S.name=t.value.trim()||'Untitled';save()}
});
document.addEventListener('dblclick',e=>{
  const x=e.target.closest('.tx');if(!x)return;
  x.closest('li').draggable=false;x.contentEditable=true;x.focus();getSelection().selectAllChildren(x);
});
document.addEventListener('focusout',e=>{
  const x=e.target;
  if(x.classList?.contains('tx')&&x.isContentEditable){const v=x.textContent.trim(),i=+x.dataset.i;v?S.tasks[i].t=v:S.tasks.splice(i,1);go()}
});
document.addEventListener('dragstart',e=>{dg=+e.target.closest?.('li')?.dataset.i});
document.addEventListener('dragover',e=>{if(e.target.closest('li'))e.preventDefault()});
document.addEventListener('drop',e=>{
  const l=e.target.closest('li');if(!l||isNaN(dg))return;
  S.tasks.splice(+l.dataset.i,0,S.tasks.splice(dg,1)[0]);dg=NaN;go();
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&foc){foc=0;render()}});
document.addEventListener('keydown',e=>{
  const t=e.target,k=e.key;
  if(k=='Escape'){add=0;if(foc)exitFoc();$('#set').hidden=true;render();return}
  if(k=='Enter'&&t.id=='ni'){A.ad();go();return}
  if(k=='Enter'&&t.isContentEditable){e.preventDefault();t.blur();return}
  if(/INPUT|TEXTAREA/.test(t.tagName)||t.isContentEditable||!S.on||S.fin||e.metaKey||e.ctrlKey||e.altKey)return;
  const K=k.toLowerCase();
  if(k==' '){e.preventDefault();t.blur?.();S.run?pause():start()}
  else if(K=='r')reset();
  else if(k=='Enter'){e.preventDefault();nxt()}
  else if(K=='f'){foc?exitFoc():A.foc()}
  else return;
  go();
});
setInterval(()=>{if(S.run&&cur()<=0)finish();else upd()},250);
render();
</script>
</body>
</html>
